name: QCopy

options:
  bundleIdPrefix: com.qzrzz
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      DEAD_CODE_STRIPPING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  QCopy:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: QCopy
        excludes:
          - Fonts
      - path: QCopy/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: QCopy
        PRODUCT_MODULE_NAME: QCopy
        PRODUCT_BUNDLE_IDENTIFIER: com.qzrzz.qcopy
        INFOPLIST_FILE: QCopy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_NAME: QCopy Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.qzrzz.qcopy.dev
        Release:
          PRODUCT_NAME: QCopy

  QCopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QCopyTests
    dependencies:
      - target: QCopy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qzrzz.qcopy.tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QCopy Dev.app/Contents/MacOS/QCopy Dev"
          BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  QCopy:
    build:
      targets:
        QCopy: all
    test:
      targets:
        - QCopyTests
